[project]
name = "templatize"
version = "0.1.0"
description = "Turn plain text into parameterised templates (Jinja2 first) with a round-trip guarantee."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8",
]

[project.scripts]
templatize = "templatize.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/templatize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src/templatize"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter owns line length
