[project]
name = "templatize"
version = "0.1.0"
description = "Turn plain text into parameterised templates (Jinja2 first) with a round-trip guarantee."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
mcp = [
    "mcp>=2.3,<3",
]
# GLiNER NER service (ONNX Runtime on CPU; no PyTorch).
ner = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2.0",
]

[project.scripts]
templatize = "templatize.cli:main"
templatize-api = "templatize_api.server:main"
templatize-healthcheck = "templatize_api.healthcheck:main"
templatize-mcp = "templatize_mcp.server:main"
templatize-ner = "templatize_ner.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/templatize", "src/templatize_api", "src/templatize_mcp", "src/templatize_ner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # Starlette 1.10 prefers the newer httpx2 for TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src/templatize", "src/templatize_api", "src/templatize_mcp", "src/templatize_ner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter owns line length
