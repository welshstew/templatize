name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test

  offline-test:
    # Builds the image (online), then runs every fixture with networking disabled.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: make offline-test CONTAINER=docker

  multiarch:
    # Verifies the image builds for amd64 and arm64 (needs QEMU on the runner).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: make image-multiarch
