name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen --all-extras
      - run: make lint
      - run: make typecheck
      # builds the UI (type-check, bundle, external-URL check) so pytest can scan it too
      - run: make frontend frontend-test
      # GLiNER model (~190 MB, pinned + verified) so the NER parity tests run in CI
      - run: make ner-model
      - run: make test

  e2e:
    # The Playwright suite: every sample and corpus document analyzed, accepted and
    # round-tripped in a real browser, against the built UI served from source.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: make frontend
      # Playwright's own Chromium (the runner has no Google Chrome), pinned by @playwright/test.
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make e2e-ci
        env:
          E2E_CHANNEL: ""
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-report
          path: |
            frontend/e2e-report/
            frontend/playwright-report/
          if-no-files-found: ignore

  offline-test:
    # Builds the image (online), then runs the stack on an internal-only network and
    # drives every fixture through the API. Needs docker + compose v2 on the runner.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: make offline-test CONTAINER=docker
      - run: make offline-test-cli CONTAINER=docker

  multiarch:
    # Verifies the image builds for amd64 and arm64 (needs QEMU on the runner).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: make image-multiarch
