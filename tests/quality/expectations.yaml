# Suggestion quality for the editor's samples (tests/quality/samples.json).
#
#   want:   values that must be suggested, each as one whole candidate value
#   reject: values that must not be suggested (format keywords, split names,
#           times mistaken for ports, block openers, ...)
#   occurrences: value -> how many places its candidate covers
#   names:  value -> the name its candidate must have
#   loops:  the repeated blocks that must be suggested, name -> number of items;
#           any other loop fails the test (default: none)
#
# Every sample needs an entry, so a new sample comes with its expectations.
# Heuristic detectors only (no LLM / NER), with the sample's examples.

nginx:
  want: [billing.example.com, /etc/nginx/certs/billing.example.com.crt, "10.20.30.41:8080", "443"]
  reject: [server, listen]

k8s:
  want: [orders-api, shop-prod, "3", registry.example.com/acme/orders-api, 1.14.2, 512Mi]
  reject: [Deployment, apps/v1]

k8s-stack:
  want: [shop-prod, storefront-config, info, "4", ghcr.io/acme/storefront, 3.9.1, 1Gi, shop.example.com, storefront-tls]
  reject: [ConfigMap, Ingress, networking.k8s.io/v1]

compose:
  loops: {web_environment: 2, db_environment: 3}  # map loops: offered, not auto-accepted
  # DATABASE_URL is built from POSTGRES_USER/PASSWORD/DB: suggested as those parts.
  want: [ghcr.io/acme/storefront:4.2.1, shop.example.com, s3cretPass, postgres:16.4]
  reject: [services, "postgres://shop:s3cretPass@db:5432/storefront"]
  # ...and its host (also the db service name and depends_on entry) and port.
  occurrences: {shop: 2, s3cretPass: 2, storefront: 2, db: 3, "5432": 1}

dotenv:
  want: [production, https://app.example.com, db-prod-01.internal.example.com, orders, sk_live_EXAMPLE0000000000000000]
  reject: []

systemd:
  want: [Event ingestion daemon, ingest, /opt/ingestd, /etc/ingestd/config.toml, "9100"]
  reject: [Event, ingestion, daemon]

terraform:
  want: [eu-west-2, acme-marketing-assets-prod, marketing, CC-4410, ami-0a1b2c3d4e5f67890, t3.medium, marketing-web-01]
  reject: ["{"]

gha:
  # rsync deploy@docs.example.com:...: the ssh user and host, not an email address.
  want: [Deploy docs, ubuntu-24.04, production, "22", docs.example.com]
  reject: [deploy@docs.example.com]
  names: {docs.example.com: ssh_host}

ssh:
  want: [bastion, db-primary, 203.0.113.10, jmorgan, "2222", ~/.ssh/id_ed25519_work, 10.0.4.21]
  reject: [Host, HostName, User]

ini:
  want: [0.0.0.0, "8443", https://wiki.example.org, "mysql://wiki:Tr0ub4dor@192.0.2.55:3306/wikidb", smtp.example.org, wiki-noreply@example.org]
  reject: []

json:
  want: [notification-gateway, 3.8.0, "7070", us-east-1, AKIAIOSFODNN7EXAMPLE, alerts@acme.example.com]
  reject: []

python:
  loops: {kafka_brokers: 3}
  want: [billing-worker, production, pg-billing.internal.example.com, billing, billing.invoices.v2, billing-oncall@example.com]
  reject: ["{"]

letter:
  # Addresses are whole, over their lines: street down to town and postcode.
  want: [Sarah, Okafor, Procurement Manager, Calder Engineering plc, "Unit 7, Riverside Park\nLeeds LS10 1AB", "14 Harbour Road\nBristol BS1 6AA", PO-55821, "18,450.00", 3 March 2026, 17 March 2026]
  reject: [Procurement, Manager, Calder, Riverside, "7,", "Unit 7, Riverside Park"]
  # Found without NER or the LLM: the name of the email, the signature, the companies.
  names: {3 March 2026: letter_date, Sarah: recipient_first_name, Okafor: recipient_last_name, Procurement Manager: recipient_title, "Unit 7, Riverside Park\nLeeds LS10 1AB": recipient_address, Ravi Patel: contact_name, "+44 117 555 0142": phone_number, Helen Clarke: sender_name, Sales Director: sender_title, Northwind Components Ltd: sender_company, Calder Engineering plc: recipient_company, "14 Harbour Road\nBristol BS1 6AA": sender_address}

invoice:
  loops: {rows: 2}  # line items: a table with padded columns
  want: [INV-2026-0412, 2026-04-01, 2026-05-01, Marlow & Hart Architects, accounts@marlowhart.example.com, "4,560.00"]
  reject: [Marlow, "&", "redesign                      1"]

welcome:
  want: [Priya, Design Ops, priya.shah@example.com, 28 May 2026]
  reject: [Design, Ops]

offer:
  want: [1 September 2026, 15 July 2026, people@orbit-analytics.example.com]
  reject: []

meeting:
  # The date and start time are in the subject line and the body: one variable each.
  want: [Amira Haddad, https://meet.example.com/j/8841-2207-553, Thursday 9 July, "14:00", "15:30"]
  reject: ["30", Amira, Haddad, Thursday, July]
  occurrences: {Thursday 9 July: 2, "14:00": 2}
  names: {"+1 415 555 0199": dial_in_phone, "66 41 09": dial_in_pin, "14:00": start_time, "15:30": end_time}

release:
  want: []
  reject: []

sql:
  loops: {users: 2}
  want: [Bluewater Logistics, bluewater, enterprise, 7f3c2a10-5b1e-4d8a-9c77-2e4f6a1b0c93, "2026-02-14 09:30:00", ops-admin@bluewater.example.com, admin, member, "150"]
  reject: [INSERT, VALUES, Bluewater, Logistics]

html-email:
  want: [elena.rossi@example.com, 2 October 2026]
  reject: ["45"]

csv:
  loops: {rows: 3}  # header-named fields: username, email, team, role
  want: [aisha.khan@example.com]
  reject: [username, email]

cloud-init:
  # Terraform templatefile sample: packages and users (with their keys) are loops.
  loops: {packages: 3, users: 2}
  want: [app-01, Europe/London, /bin/bash]
  reject: ["#cloud-config", laptop, ops, backup, nginx, ssh-ed25519]
  names: {app-01: hostname, Europe/London: timezone}

haproxy:
  loops: {servers: 3}  # server lines: name and endpoint
  want: [/etc/haproxy/certs/shop.example.com.pem, "10.0.1.11:8080"]
  reject: [shop, roundrobin]

nginx-envsubst:
  # envsubst sample: nginx's own $host and $remote_addr are not values.
  loops: {proxy_set_headers: 2}
  want: ["80", shop.example.com, "http://storefront.internal.example.com:3000", "http://orders-api.internal.example.com:8080/", 30s]
  reject: [$host, $remote_addr, host, remote_addr]
