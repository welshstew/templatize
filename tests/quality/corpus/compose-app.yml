services:
  api:
    image: ghcr.io/acme/billing-api:2.3.0
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://billing:B1llingPw@db:5432/billing
      LOG_LEVEL: info
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
  db:
    image: postgres:16.4
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: B1llingPw
      POSTGRES_USER: billing
      POSTGRES_DB: billing

volumes:
  db-data:
