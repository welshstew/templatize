global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.monitoring.svc:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["10.1.0.21:9100", "10.1.0.22:9100", "10.1.0.23:9100"]
  - job_name: api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api.prod.example.com:8443"]
