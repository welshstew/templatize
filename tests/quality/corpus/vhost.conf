<VirtualHost *:443>
    ServerName intranet.example.org
    ServerAlias www.intranet.example.org
    DocumentRoot /var/www/intranet/public
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/intranet.example.org.crt
    SSLCertificateKeyFile /etc/ssl/private/intranet.example.org.key
    ErrorLog ${APACHE_LOG_DIR}/intranet_error.log
    ProxyPass /api http://127.0.0.1:9000/api
</VirtualHost>
