replicaCount: 3
image:
  repository: ghcr.io/acme/notifications
  tag: "2.7.1"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: notify.acme.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: notify-tls
      hosts: [notify.acme.example.com]
resources:
  limits:
    cpu: 500m
    memory: 256Mi
