apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-portal
  namespace: docs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [docs.example.com]
      secretName: docs-example-com-tls
  rules:
    - host: docs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs-portal
                port:
                  number: 8080
