# Forward everything to the central log server
module(load="omfwd")
action(type="omfwd" target="logs.central.example.org" port="6514" protocol="tcp"
       StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
       StreamDriverPermittedPeers="logs.central.example.org"
       queue.type="LinkedList" queue.size="50000" action.resumeRetryCount="-1")
