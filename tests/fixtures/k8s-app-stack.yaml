# Storefront: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-config
  namespace: shop-prod
data:
  LOG_LEVEL: info
  FEATURE_FLAGS: "checkout-v2,search-beta"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop-prod
  labels:
    app.kubernetes.io/name: storefront
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
    spec:
      containers:
        - name: web
          image: ghcr.io/acme/storefront:3.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: storefront-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: shop-prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: shop-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
      secretName: storefront-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
