# Public demo (e.g. templatize.getlockstep.cloud): the app plus GLiNER, behind a
# reverse proxy on the same host. No LLM (no GPU) and no MCP endpoint.
#
#   cp .env.example .env            # check DEMO_PORT and TRUSTED_PROXIES, then:
#   docker compose up -d --build
#
# Add the site block from Caddyfile to the host's Caddy and reload it.
name: templatize-demo

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped

services:
  app:
    image: templatize:demo
    build:
      context: ../..
      dockerfile: docker/app.Dockerfile
      target: runtime
    <<: *hardening
    ports:
      # Loopback only: the reverse proxy is the one way in.
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-8100}:8000"
    environment:
      TEMPLATIZE_NER_URL: http://ner:8081
      TEMPLATIZE_LLM_URL: ""
      TEMPLATIZE_MCP_HTTP: "0"
      TEMPLATIZE_ACCESS_LOG: "0"
      TEMPLATIZE_RATE_LIMIT: ${RATE_LIMIT:-120/minute}
      TEMPLATIZE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set TRUSTED_PROXIES to the reverse proxy address(es)}
      TEMPLATIZE_NER_MAX_CHARS: ${NER_MAX_CHARS:-50000}
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "templatize-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      ner:
        condition: service_healthy

  ner:
    image: templatize-ner:demo
    build:
      context: ../..
      dockerfile: docker/ner.Dockerfile
    <<: *hardening
    environment:
      TEMPLATIZE_NER_THREADS: ${NER_THREADS:-2}
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "templatize-ner", "--check"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s
