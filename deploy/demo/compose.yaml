# Public demo (templatize.getlockstep.cloud): the app plus GLiNER, behind a Caddy
# container that already runs on the host. No LLM (no GPU) and no MCP endpoint.
#
# The app joins Caddy's network (PROXY_NETWORK) as "templatize-app" and publishes no
# host port; GLiNER is only on this project's own network.
#
#   cp .env.example .env            # check PROXY_NETWORK and TRUSTED_PROXIES, then:
#   docker compose up -d --build
#
# Add the site block from Caddyfile to Caddy's config and reload it.
name: templatize-demo

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped

services:
  app:
    image: templatize:demo
    build:
      context: ../..
      dockerfile: docker/app.Dockerfile
      target: runtime
    <<: *hardening
    networks:
      default:
      proxy:
        aliases: [templatize-app]
    environment:
      TEMPLATIZE_NER_URL: http://ner:8081
      TEMPLATIZE_LLM_URL: ""
      TEMPLATIZE_MCP_HTTP: "0"
      TEMPLATIZE_ACCESS_LOG: "0"
      TEMPLATIZE_RATE_LIMIT: ${RATE_LIMIT:-120/minute}
      TEMPLATIZE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set TRUSTED_PROXIES to the reverse proxy address(es)}
      TEMPLATIZE_NER_MAX_CHARS: ${NER_MAX_CHARS:-50000}
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "templatize-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      ner:
        condition: service_healthy

  ner:
    image: templatize-ner:demo
    build:
      context: ../..
      dockerfile: docker/ner.Dockerfile
    <<: *hardening
    environment:
      TEMPLATIZE_NER_THREADS: ${NER_THREADS:-2}
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "templatize-ner", "--check"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  default: {}
  proxy:
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the reverse proxy's docker network}
    external: true
